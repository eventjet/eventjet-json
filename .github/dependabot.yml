version: 2
updates:
  # Dependabot pull requests are squash-merged like any other, so their titles
  # have to parse as Conventional Commits for release-please to pick them up.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      development-tools:
        dependency-type: development
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: test
      include: scope
