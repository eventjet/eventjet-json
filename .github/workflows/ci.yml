name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_ROOT_VERSION: dev-master

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-php
      - name: Restore analyzer caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: analysis-${{ runner.os }}-php8.4-${{ hashFiles('vendor/composer/installed.json', 'phpstan.neon', 'psalm.xml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: analysis-${{ runner.os }}-php8.4-${{ hashFiles('vendor/composer/installed.json', 'phpstan.neon', 'psalm.xml') }}-
      - name: Restore Mago binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/carthage-software/mago/composer/bin/[0-9]*
          key: mago-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/composer/installed.json') }}
      - run: mkdir -p .cache
      - name: Validate dependencies
        run: |
          composer validate --strict
          composer check-deps
      - name: Formatting and Mago
        run: |
          composer cs-check
          composer mago
      - name: Psalm
        run: composer psalm -- --threads=2 --no-progress
      - name: PHPStan
        run: composer phpstan -- --no-progress

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-php
        with:
          php-version: ${{ matrix.php }}
      - name: Restore PHPUnit cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .phpunit.cache
          key: phpunit-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('vendor/composer/installed.json', 'phpunit.xml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: phpunit-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('vendor/composer/installed.json', 'phpunit.xml') }}-
      - name: PHPUnit
        timeout-minutes: 2
        run: composer phpunit -- --no-progress

  parity:
    name: PHPDoc parity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # phpdoc-parser 2.3.6 triggers PHP 8.5 warnings when it casts oversized Unicode escapes to int.
      - uses: ./.github/actions/setup-php
      - name: Compare with phpstan/phpdoc-parser
        timeout-minutes: 8
        run: composer parity -- --no-progress

  mutation-shard:
    name: Mutation tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-php
        with:
          coverage: pcov
          ini-values: pcov.enabled=0
      - name: Restore PHPStan analysis
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: analysis-${{ runner.os }}-php8.4-${{ hashFiles('vendor/composer/installed.json', 'phpstan.neon', 'psalm.xml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: analysis-${{ runner.os }}-php8.4-${{ hashFiles('vendor/composer/installed.json', 'phpstan.neon', 'psalm.xml') }}-
      - name: Full mutation coverage of this shard's files
        shell: bash
        timeout-minutes: 15
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          mkdir -p build
          php .github/ci/mutation-shard.php "$SHARD" "$SHARDS" > "$RUNNER_TEMP/mutation-files.txt"
          mapfile -t files < "$RUNNER_TEMP/mutation-files.txt"
          composer infection -- --threads=4 --no-progress --initial-tests-php-options="-d pcov.enabled=1" --logger-summary-json=build/mutation-summary.json "${files[@]}" 2>&1 | tee "$RUNNER_TEMP/mutation-output.txt"
      - name: Save mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ matrix.shard }}
          path: |
            infection-log.txt
            build/mutation-summary.json
            ${{ runner.temp }}/mutation-output.txt
          retention-days: 7

  mutation:
    name: Mutation tests
    needs: mutation-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every shard to pass
        env:
          RESULT: ${{ needs.mutation-shard.result }}
        run: test "$RESULT" = success
