name: Unpartitioned mutation benchmark

on:
  push:
    branches: [experiment/pr14-unpartitioned]

permissions:
  contents: read

env:
  COMPOSER_ROOT_VERSION: dev-tabula-rasa

jobs:
  mutation:
    name: Full mutation suite without partitioning
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-php
        with:
          coverage: pcov
      - name: Benchmark the full source tree with four workers
        timeout-minutes: 55
        shell: bash
        run: |
          start=$SECONDS
          set +e
          /usr/bin/time -v php -d memory_limit=4G vendor/bin/infection --threads=4 --with-uncovered --no-progress 2>&1 | tee mutation-benchmark.log
          result=${PIPESTATUS[0]}
          set -e
          elapsed=$((SECONDS-start))
          printf 'Wall time: %s seconds\nExit code: %s\nWorkers: 4\nInfection PHP memory limit: 4 GiB\n' "$elapsed" "$result" | tee mutation-benchmark-result.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Save benchmark output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unpartitioned-mutation-benchmark
          path: |
            mutation-benchmark.log
            mutation-benchmark-result.txt
            infection-log.txt
          retention-days: 7
