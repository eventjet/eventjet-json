name: Performance

on:
  pull_request:
  push:
    branches: [master, tabula-rasa]
  workflow_dispatch:
    inputs:
      calibrate:
        description: Compare unchanged code on five independent runners
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_ROOT_VERSION: dev-tabula-rasa

jobs:
  compare:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.calibrate && format('Calibrate decoder performance ({0})', matrix.sample) || 'Compare decoder performance' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.calibrate && '[1,2,3,4,5]' || '[1]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup-php
      - name: Validate performance tooling
        run: |
          vendor/bin/phpstan analyze .github/ci --no-progress
          bash .github/ci/tests/configuration.sh
      - name: Compare target with proposed merge
        shell: bash
        env:
          CALIBRATE: ${{ github.event_name == 'workflow_dispatch' && inputs.calibrate }}
        run: |
          base=HEAD^1
          if [ "$CALIBRATE" = true ]; then base=HEAD; fi
          php .github/ci/performance.php --base "$base" --candidate HEAD
      - name: Save measurements and environment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.sample }}
          path: .perf/results
          retention-days: 90
